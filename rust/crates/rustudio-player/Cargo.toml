[package]
name = "rustudio-player"
description = "Play Roblox places with the rustudio engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rustudio-account = { path = "../rustudio-account" }
rustudio-core = { path = "../rustudio-core" }
rustudio-physics = { path = "../rustudio-physics" }
rustudio-render = { path = "../rustudio-render" }
rustudio-engine = { path = "../rustudio-engine" }
egui = "0.36"
rustudio-profiler-ui = { path = "../rustudio-profiler-ui" }
egui-wgpu = "0.36"
rbx_dom_weak = "4"
gilrs = "0.11"
glam = { version = "0.30", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde_json = { version = "1", features = ["preserve_order"] }
pollster = "0.4"
mlua = { version = "0.12", features = ["luau"] }
rapier3d = { version = "0.36", features = ["parallel", "profiler"] }
rustc-hash = "2"
chrono = { version = "0.4.35", default-features = false, features = ["clock"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_ProcessStatus"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["wgpu", "wayland", "x11", "default_fonts", "links"] }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "links", "android-native-activity"] }
