[package]
name = "rustudio-core"
description = "Document, math, shared data types, asset cache, terrain data, logging and bench for rustudio"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
test-support = []

[dependencies]
log = "0.4"
rustudio-account = { path = "../rustudio-account" }
libc = "0.2"
rbx_dom_weak = "4"
rbx_binary = "3"
# DataModelPatch.rbxm's compressed chunks (core_scripts.rs; rbx_binary's own)
zstd = "0.13"
lz4_flex = "0.13"
rbx_xml = "3"
rbx_reflection_database = "3"
rbx_reflection = "7"
rbx_types = "3"
glam = { version = "0.30", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rustc-hash = "2"
draco-core = { version = "2.3", default-features = false, features = ["decoder", "edgebreaker_valence_decode", "legacy_bitstream_decode"] }
# Studio content download (studio_content.rs)
ureq = "3"
dirs = "6"
chrono = { version = "0.4.35", default-features = false, features = ["clock"] }

[target.'cfg(windows)'.dependencies]
# The Recycle Bin (platform.rs); thread CPU time and cycles (bench.rs).
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_Foundation", "Win32_System_Threading", "Win32_System_WindowsProgramming", "Win32_System_Memory"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The Finder trash (platform.rs).
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSFileManager", "NSURL", "NSString", "NSError"] }

[dev-dependencies]
# mesh.rs's tests encode a mesh (the root crate's dev-dependency).
draco-core = { version = "2.3", default-features = false, features = ["decoder", "encoder"] }
