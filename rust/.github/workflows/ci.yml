name: CI

on:
  push:
    # (branches as well as tags: a filter on one alone stops runs for the other)
    branches: ['**']
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']

permissions:
  contents: read

jobs:
  # Checks and tests run for branches and pull requests. A v* tag points at a
  # commit main already tested, so its run only builds and publishes.
  check:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libudev-dev
      - run: cargo check --workspace --all-targets --locked
      # The Linux runner has no display, which the editor self-test needs.
      - if: runner.os != 'Linux'
        run: cargo test --workspace --locked

  # macOS: Apple Silicon and Intel. The tests run here too (the GPU tests
  # skip themselves when the runner has no Metal device).
  macos:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  # rustudio.app for Apple Silicon and Intel in one (ad-hoc signed, not
  # notarized), as a build artifact; attached to the release for a v* tag.
  macos-app:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: tools/macos/bundle.sh --universal
      - name: Check the bundle
        run: |
          lipo -archs target/macos/rustudio.app/Contents/MacOS/rustudio | grep -q 'x86_64 arm64'
          codesign --verify --strict target/macos/rustudio.app
          test -f target/macos/rustudio.app/Contents/Resources/api-dump.json
      - uses: actions/upload-artifact@v4
        with:
          name: rustudio-macos-universal
          path: target/macos/*.zip

  # Linux x86_64 (built on 22.04 so it runs on older glibc) and Windows x64:
  # the binary, api-dump.json beside it, and the licences.
  linux-release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libudev-dev
      - run: cargo build --workspace --release --locked
      - name: Package
        run: |
          tools/linux/package.sh target/release/rustudio dist/rustudio-linux-x86_64.tar.gz
      - name: Verify Linux installation
        run: python3 tools/linux/test-package.py dist/rustudio-linux-x86_64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: rustudio-linux-x86_64
          path: dist/*.tar.gz

  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release --locked
      - name: Package
        shell: pwsh
        run: |
          $d = "dist/rustudio-windows-x64"
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item target/release/rustudio.exe, api-dump.json, LICENSE-MIT, LICENSE-APACHE, README.md $d
          Copy-Item tools/windows/install.ps1, tools/windows/install.cmd, tools/windows/uninstall.cmd $d
          Compress-Archive -Path $d -DestinationPath dist/rustudio-windows-x64.zip
      - name: Verify Windows installation
        shell: pwsh
        run: tools/windows/test-package.ps1 -Archive dist/rustudio-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: rustudio-windows-x64
          path: dist/*.zip

  # A v* tag: attaches the three downloads and their SHA-256 sums to the
  # release the maintainer drafted for this tag, then publishes it. This job
  # never creates a release: one made here would be credited to
  # github-actions instead of its author.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos-app, linux-release, windows-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::No release exists for $GITHUB_REF_NAME. The maintainer drafts it first (gh release create $GITHUB_REF_NAME --draft --title \"rustudio $GITHUB_REF_NAME\" --notes-file NOTES.md), then this job is re-run."
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          # A pre-release (vX.Y.Z-alpha.N, drafted with --prerelease by
          # rustudio-release) stays one and never becomes "latest", which
          # the in-app updater reads; a stable release becomes latest.
          if [ "$(gh release view "$GITHUB_REF_NAME" --json isPrerelease -q .isPrerelease)" = true ]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease --latest=false
          else
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          fi
