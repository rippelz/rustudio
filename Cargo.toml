[workspace]
members = [".", "crates/rustudio-account", "crates/rustudio-net"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[package]
name = "rustudio"
description = "A native Linux/Windows game editor for Roblox place and model files"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "rustudio"

[dependencies]
rustudio-account = { path = "crates/rustudio-account" }
rustudio-net = { path = "crates/rustudio-net" }
libc = "0.2"
eframe = { version = "0.36", default-features = false, features = ["wgpu", "wayland", "x11", "default_fonts", "links"] }
egui = "0.36"
egui-wgpu = "0.36"
egui_dock = { version = "0.21", features = ["serde"] }
rbx_dom_weak = "4"
rbx_binary = "3"
rbx_xml = "3"
rbx_reflection_database = "3"
rbx_reflection = "7"
rbx_types = "3"
glam = { version = "0.30", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
flate2 = "1"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
pollster = "0.4"
mlua = { version = "0.12", features = ["luau"] }
rapier3d = { version = "0.36", features = ["parallel", "profiler"] }
draco-core = { version = "2.3", default-features = false, features = ["decoder", "edgebreaker_valence_decode", "legacy_bitstream_decode"] }
rodio = { version = "0.23", default-features = false, features = ["playback", "vorbis", "mp3", "wav", "flac"] }
notify = "8"
glob = "0.3"
toml = "0.9"
rustc-hash = "2"
# services domain: HttpService (real HTTP), EncodingService (zstd, hashes)
ureq = "3"
zstd = "0.13"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
blake2 = "0.10"
blake3 = "1"
dirs = "6"
chrono = { version = "0.4.35", default-features = false, features = ["clock"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# `cargo build --profile profiling` for perf: release speed with symbols.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"

[target.'cfg(windows)'.dependencies]
# The Recycle Bin (platform.rs).
windows-sys = { version = "0.61", features = ["Win32_UI_Shell"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The Finder trash (platform.rs), the app menu and Finder's Open (macos.rs).
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSFileManager", "NSURL", "NSString", "NSError", "NSAppleEventDescriptor", "NSAppleEventManager", "NSNotification", "NSObject"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSMenu", "NSMenuItem", "NSEvent"] }
# (only for EventLoopBuilderExtMacOS, on eframe's own winit)
winit = { version = "0.30", default-features = false }

[dev-dependencies]
draco-core = { version = "2.3", default-features = false, features = ["decoder", "encoder"] }

[patch.crates-io]
rustls = { path = "vendor/rustls" }
# Luau 745 (crates.io luau0-src 0.23.0+luau745): its compiler reuses dead
# locals' registers, without which Place A' Weapons client (3k lines)
# runs out of the 200 local registers. mlua-sys 0.13.0 is vendored only to
# accept it (dep 0.22 -> 0.23, bytecode version max 11 -> 14). See
# runtime::luau_flags.
luau0-src = { path = "vendor/luau0-src" }
mlua-sys = { path = "vendor/mlua-sys" }
# mlua 0.12.2 + Lua::with_current_state (src/state.rs, marked rustudio):
# the direct Instance bridge (runtime_routes.rs) calls Rust from raw C
# functions and must make the calling Lua thread mlua's current one, as
# mlua's own callbacks do.
mlua = { path = "vendor/mlua" }
# egui 0.36.2 patched (text_selection/, scroll_area.rs): double/
# triple click select on the press, not the release, like Studio.
egui = { path = "vendor/egui" }
# rbx_dom_weak 4.2.0 + detach_children / detach_descendants and an
# end-first child removal: bulk Destroy / ClearAllChildren without a scan
# of the parent's child list per child (round 2 perf, bulk).
rbx_dom_weak = { path = "vendor/rbx_dom_weak" }
